name: 버그 보고
description: 재현 가능한 결함과 회귀를 보고합니다.
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 실행한 명령, 게시물 id, 로그(data/uploader.log) 일부를 적으세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전·커밋
    validations:
      required: true
