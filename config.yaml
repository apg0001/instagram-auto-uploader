# 인스타그램 자동 업로더 설정
# 비밀 값(토큰)은 .env 에 둔다. (.env.example 참고)

timezone: Asia/Seoul
data_dir: data            # 생성물·SQLite 상태가 쌓이는 곳

media:
  repo_dir: media-repo                       # apg0001/ig-media 로컬 클론
  pages_base: https://apg0001.github.io/ig-media
  retention_days: 7                          # 게시(또는 반려) 후 며칠 뒤 삭제할지
  pages_wait_seconds: 600                    # 푸시 후 Pages 반영을 기다리는 최대 시간

instagram:
  # 연동 전에는 false. true로 바꾸고 .env에 IG_USER_ID / IG_ACCESS_TOKEN 을 넣으면 실제 게시한다.
  enabled: false
  api_version: v24.0

notion:
  # .env에 NOTION_TOKEN 이 있으면 자동으로 켜진다. DB id는 `notion-setup` 이 상태 DB에 저장한다.
  api_version: "2022-06-28"

caption:
  command: [claude, -p, --no-session-persistence, --output-format, text]
  model: null           # 예: sonnet / haiku. null이면 Claude Code 기본 모델
  timeout_seconds: 300

# 콘텐츠 소스. 게시물에는 레포(GitHub 저장소)를 언급하지 않고 게임만 소개한다.
sources:
  lab-wars:
    title: 랩워즈 (Lab Wars)
    play_url: https://apg0001.github.io/lab-wars/
    tagline: 교수님에게서 연구실을 지켜라!
    facts:
      - 모바일 웹에서 가로 화면으로 플레이하는 횡스크롤 라인 디펜스 게임. 설치 없이 브라우저에서 바로, 홈 화면 설치(PWA)·오프라인 플레이도 된다.
      - 카페인을 모아 연구실 동료를 내보내고, 교수님이 쏟아내는 잡무 군단을 밀어내 교수실을 함락하는 게 목표.
      - 아군 12종. 학부 → 석사 → 박사로 진화하는 연구실 사람들, 연구용 드론(공중), GPU 서버(공성), AI 조수 패러디 유닛(클로디·코덱시·재미나이).
      - 적 10종과 보스 7종. 잡무 쪽지, 회의 소환장부터 리뷰어 2, 학회장님, 심사위원장님, 학과장님, 최종 보스 총장님까지.
      - 학부생 → 학연생 → 학석사 → 석사 → 석박 → 박사 → 포닥, 7챕터 70스테이지. 방학·춘하추동 학회·졸업논문 이벤트 스테이지.
      - 스테이지마다 움직이는 캐릭터 스토리 컷신, 건너뛸 수 없는 엔딩, 끝없이 강해지는 무한 모드, 으스스한 외전 3편(조교수 생존기·대학원 괴담·연구자의 고충), 순위표.
      - 커피머신 업그레이드, 양측 자동 포탑(프린터), 멘탈 스킬 4종, 별 3개 평가, 연구비로 유닛 레벨업·진화와 시설 강화.
      - 배경음악·효과음 모두 직접 합성. 계정 로그인하면 어느 기기에서든 이어서 플레이, 게스트는 기기 내 저장.
    # 녹화에 쓸 스테이지(돌아가며 사용). 최종 스테이지(7-10)는 엔딩을 건너뛸 수 없어 제외.
    showcase_stages: ["1-5", "1-10", "2-6", "2-10", "3-4", "3-10", "4-7", "4-10", "5-5", "5-10", "6-6", "6-10", "7-4"]
    reel_seconds: 28
